services:
  # --- Init Service: Prepares permissions for Firefly III ---
  firefly-init:
    extends:
      file: ../../shared/templates.yml
      service: base-init
    container_name: firefly_init

    # Execution: Create data directories and set permissions
    command: >
      sh -c "
        mkdir -p /data/upload /data/db &&
        chown -R ${FIREFLY_PUID:-1007}:${FIREFLY_PGID:-1007} /data/upload
      "

    # State: Mount data directory
    volumes:
      - ./data:/data

  # --- Internal Database Service: MariaDB ---
  db:
    extends:
      file: ../../shared/templates.yml
      service: base-default
    image: mariadb:lts
    container_name: firefly_db

    # Connectivity: Expose internal network for other containers
    networks:
      - firefly-internal

    # Configuration: Natively auto-creates the databases and users on first startup (Alphabetized)
    environment:
      # Core Database Settings
      MARIADB_AUTO_UPGRADE: "true"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?}"

      # Firefly III App Database & User Settings
      MARIADB_DATABASE: "${FIREFLY_DB_DATABASE:-firefly}"
      MARIADB_PASSWORD: "${FIREFLY_DB_PASSWORD:?}"
      MARIADB_USER: "${FIREFLY_DB_USERNAME:-firefly}"

    # State: Mount database storage volume
    volumes:
      - ./data/db:/var/lib/mysql

    # Monitoring: Built-in check to ensure the InnoDB engine is fully initialized
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Main Web Service: Firefly III Core ---
  app:
    extends:
      file: ../../shared/templates.yml
      service: base-default
    image: fireflyiii/core:${FIREFLY_DOCKER_TAG:-latest}
    container_name: firefly_core

    # Lifecycle: Wait for permissions to be fixed and database to be healthy
    depends_on:
      firefly-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    # Connectivity: Public facing proxy and internal database network
    networks:
      - traefik-public
      - firefly-internal

    # Configuration: Core application and database connection settings (Alphabetized)
    environment:
      APP_DEBUG: "false"
      APP_ENV: "$local"
      APP_KEY: "${FIREFLY_APP_KEY:?}"
      DB_CONNECTION: "mysql"
      DB_DATABASE: "firefly"
      DB_HOST: "db"
      DB_PASSWORD: "${FIREFLY_DB_PASSWORD:?}"
      DB_PORT: "3306"
      DB_USERNAME: "firefly"
      SITE_OWNER: "${FIREFLY_SITE_OWNER:?}"
      TZ: "${TZ:-Etc/UTC}"

    # Routing: Traefik dynamic configuration (Alphabetized)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firefly.entrypoints=websecure"
      - "traefik.http.routers.firefly.rule=Host(`${FIREFLY_SUBDOMAIN:-firefly}.${DOMAIN_PRIMARY:-localhost}`)"
      - "traefik.http.services.firefly.loadbalancer.server.port=8080"

    # State: Mount upload volume
    volumes:
      - ./data/upload:/var/www/html/storage/upload

  # --- Recurring Automation Service: Firefly III Cron ---
  cron:
    extends:
      file: ../../shared/templates.yml
      service: base-default
    image: alpine:latest
    container_name: firefly_cron

    # Lifecycle: Wait for core application to be ready
    depends_on:
      - app

    # Connectivity: Internal network to reach Firefly core
    networks:
      - firefly-internal

    # Configuration: Timezone for cron daemon execution
    environment:
      TZ: "${TZ:-Etc/UTC}"

    # Execution: Register cron job and run daemon
    command:
      - /bin/sh
      - -c
      - |
        echo "${FIREFLY_STATIC_CRON_SCHEDULE:-0 3 * * *} wget -qO- http://app:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN} > /dev/null 2>&1" | crontab -
        exec crond -f -L /dev/stdout

# --- Global Network Definitions ---
networks:
  traefik-public:
  firefly-internal:
    name: firefly-internal
    internal: true

services:
  # --- Init Service: Prepares permissions for Firefly III ---
  firefly-init:
    extends:
      file: ../../shared/templates.yml
      service: base-init
    container_name: firefly-init

    # Execution: Create data directories and set permissions
    command: >
      sh -c "
        chown -R ${FIREFLY_PUID:-1007}:${FIREFLY_PGID:-1007} /data-db &&
        chown -R ${FIREFLY_PUID:-1007}:33 /data-upload /data-import
      "

    # State: Mount data directory
    volumes:
      - ./data/db:/data-db
      - ./data/upload:/data-upload
      - ./data/import:/data-import

  # --- Internal Database Service: MariaDB ---
  firefly-db:
    extends:
      file: ../../shared/templates.yml
      service: base-secure
    image: mariadb:${MARIADB_DOCKER_TAG:-11.8}
    container_name: firefly-db

    # Security: Run as non-root user, lock filesystem
    user: "${FIREFLY_PUID:-1007}:${FIREFLY_PGID:-1007}"
    read_only: true

    # Lifecycle: Wait for permissions to be fixed
    depends_on:
      firefly-init:
        condition: service_completed_successfully

    # Connectivity: Expose internal network for other containers
    networks:
      - firefly-internal

    # Configuration: Natively auto-creates the databases and users on first startup (Alphabetized)
    environment:
      MARIADB_AUTO_UPGRADE: "true"
      MARIADB_DATABASE: "firefly"
      MARIADB_PASSWORD: "${FIREFLY_DB_PASSWORD:?}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?}"
      MARIADB_USER: "firefly"

    # State: Mount database storage volume and in-memory temp areas
    volumes:
      - ./data/db:/var/lib/mysql
    tmpfs:
      - /tmp
      - /run/mysqld

    # Monitoring: Built-in check to ensure the InnoDB engine is fully initialized
    healthcheck:
      test: "healthcheck.sh --connect --innodb_initialized"

  # --- Main Web Service: Firefly III Core ---
  firefly:
    extends:
      file: ../../shared/templates.yml
      service: base-secure
    image: fireflyiii/core:${FIREFLY_DOCKER_TAG:-version-6}
    container_name: firefly

    # Lifecycle: Wait for permissions to be fixed and database to be healthy
    depends_on:
      firefly-init:
        condition: service_completed_successfully
      firefly-db:
        condition: service_healthy

    # Connectivity: Public facing proxy and internal database network
    networks:
      - traefik-public
      - firefly-internal

    # Configuration: Core application and database connection settings (Alphabetized)
    environment:
      APP_ENV: "production"
      APP_KEY: "${FIREFLY_APP_KEY:?}"
      APP_URL: "https://${FIREFLY_SUBDOMAIN:-firefly}.${DOMAIN_PRIMARY:-localhost}"
      COOKIE_SECURE: "true"
      DB_DATABASE: "firefly"
      DB_HOST: "firefly-db"
      DB_PASSWORD: "${FIREFLY_DB_PASSWORD:?}"
      DB_PORT: "3306"
      DB_USERNAME: "firefly"
      DKR_CHECK_SQLITE: "false"
      SITE_OWNER: "${FIREFLY_SITE_OWNER:?}"
      STATIC_CRON_TOKEN: "${FIREFLY_STATIC_CRON_TOKEN:?}"
      TRUSTED_PROXIES: "**"

    # Routing: Traefik dynamic configuration (Alphabetized)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firefly.entrypoints=websecure"
      - "traefik.http.routers.firefly.rule=Host(`${FIREFLY_SUBDOMAIN:-firefly}.${DOMAIN_PRIMARY:-localhost}`)"
      - "traefik.http.services.firefly.loadbalancer.server.port=8080"

    # State: Mount upload volume
    volumes:
      - ./data/upload:/var/www/html/storage/upload

    # Monitoring: Probe web server
    healthcheck:
      test: "curl -f http://127.0.0.1:8080 || exit 1"

  firefly-import:
    extends:
      file: ../../shared/templates.yml
      service: base-secure
    image: fireflyiii/data-importer:${FIREFLY_IMPORT_DOCKER_TAG:-version-2}
    container_name: firefly-import

    # Lifecycle: Wait for core application to be ready
    depends_on:
      firefly:
        condition: service_started

    # Connectivity: Public facing proxy and internal database network
    networks:
      - traefik-public
      - firefly-internal

    # Configuration: Core application and database connection settings (Alphabetized)
    environment:
      APP_ENV: "production"
      COOKIE_SECURE: "true"
      FIREFLY_III_URL: "http://firefly:8080"
      TRUSTED_PROXIES: "**"
      VANITY_URL: "https://${FIREFLY_SUBDOMAIN:-firefly}.${DOMAIN_PRIMARY:-localhost}"

    # Routing: Traefik dynamic configuration (Alphabetized)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firefly-import.entrypoints=websecure"
      - "traefik.http.routers.firefly-import.rule=Host(`${FIREFLY_IMPORT_SUBDOMAIN:-firefly-import}.${DOMAIN_PRIMARY:-localhost}`)"
      - "traefik.http.services.firefly-import.loadbalancer.server.port=8080"

    # State: Mount data directory
    volumes:
      - ./data/import:/import

    # Monitoring: Probe web server
    healthcheck:
      test: "curl -f http://127.0.0.1:8080 || exit 1"

  # --- Recurring Automation Service: Firefly III Cron ---
  firefly-cron:
    extends:
      file: ../../shared/templates.yml
      service: base-secure
    image: alpine:${ALPINE_DOCKER_TAG:-3.24}
    platform: linux/amd64
    container_name: firefly-cron

    # Security: Read-only root filesystem & minimal capabilities
    read_only: true
    cap_add:
      - SETUID
      - SETGID

    # Lifecycle: Wait for core application to be ready
    depends_on:
      firefly:
        condition: service_started

    # Connectivity: Internal network to reach Firefly core
    networks:
      - firefly-internal

    # Execution: Register cron job and run daemon
    command:
      - /bin/sh
      - -c
      - |
        echo "${FIREFLY_STATIC_CRON_SCHEDULE:-0 3 * * *} wget -qO- http://firefly:8080/api/v1/cron/${FIREFLY_STATIC_CRON_TOKEN} > /dev/null 2>&1" | crontab -
        exec crond -f -L /dev/stdout

    # State: Mount in-memory temp areas
    tmpfs:
      - /tmp
      - /var/run
      - /var/spool/cron/crontabs

  # Monitoring: Ensure crond daemon is actively running
    healthcheck:
      test: "pgrep crond"

# --- Global Network Definitions ---
networks:
  traefik-public:
  firefly-internal:
    name: firefly-internal
    internal: true
# ==============================================================================
# Firefly III Stack (apps/firefly/firefly.yml)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Core Application (Laravel)
  # ----------------------------------------------------------------------------
  app:
    image: fireflyiii/core:latest
    container_name: firefly_iii_core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik_network
      - firefly_internal
    volumes:
      - firefly_upload:/var/www/html/storage/upload:rw
    env_file:
      - ../../.env
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.firefly.rule=Host(`\({FIREFLY_III_SUBDOMAIN:-firefly}.\){DOMAIN_PRIMARY:-localhost}`)'
      - 'traefik.http.routers.firefly.entrypoints=websecure'
      - 'traefik.http.routers.firefly.tls=true'
      - 'traefik.http.routers.firefly.tls.certresolver=letsencrypt'
      - 'traefik.http.services.firefly.loadbalancer.server.port=8080'

  # ----------------------------------------------------------------------------
  # Database Backend (MariaDB LTS)
  # ----------------------------------------------------------------------------
  db:
    image: mariadb:lts
    container_name: firefly_iii_db
    restart: unless-stopped
    networks:
      - firefly_internal
    volumes:
      - firefly_db:/var/lib/mysql:rw
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Recurring Automation / Cron Runner
  # ----------------------------------------------------------------------------
  cron:
    image: alpine:latest
    container_name: firefly_iii_cron
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - firefly_internal
    env_file:
      - ../../.env
    command:
      - /bin/sh
      - -c
      - |
        echo "\({STATIC_CRON_SCHEDULE:-0 3 * * *} wget -qO- http://app:8080/api/v1/cron/\){STATIC_CRON_TOKEN} > /dev/null 2>&1" | crontab -
        exec crond -f -L /dev/stdout

# ==============================================================================
# Global Volume Definitions
# ==============================================================================
volumes:
  firefly_upload:
    name: firefly_iii_upload
  firefly_db:
    name: firefly_iii_db

# ==============================================================================
# Network Declarations
# ==============================================================================
networks:
  firefly_internal:
    driver: bridge
    internal: true
  traefik_network:
    external: true
    name: traefik_network